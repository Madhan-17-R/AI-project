[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I include

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    claws/BH1750 @ ^1.3.0
